name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -e ".[dev,yaml,research,changepoint,dashboard]"

      - name: Пересобрать Fiscal Reference Panel
        run: python scripts/build_fiscal_reference_panel.py

      - name: Запустить тесты
        run: python -m pytest

      - name: Проверить структуру проекта
        run: python scripts/validate_project.py

      - name: Подготовить Windows сборку
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/MESM
          rsync -a             --exclude '.git'             --exclude '.github'             --exclude '.venv'             --exclude 'dist'             --exclude '__pycache__'             --exclude '.pytest_cache'             --exclude '*.egg-info/'             ./ dist/MESM/

      - name: Сохранить Windows сборку
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MESM_Windows
          path: dist/MESM
          if-no-files-found: error
          retention-days: 30
