[project]
name = "mesm"
version = "0.1.0"
description = "Municipal Economic Shock Monitor"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
yaml = ["PyYAML>=6"]
rar = ["rarfile>=4"]
changepoint = ["numpy>=1.26", "ruptures>=1.1.9"]
research = ["numpy>=1.26", "pandas>=2", "scipy>=1.11"]
dashboard = ["streamlit>=1.40", "pandas>=2", "plotly>=5.24", "openpyxl>=3.1", "xlrd>=2.0.1"]
excel = ["pandas>=2", "openpyxl>=3.1", "xlrd>=2.0.1"]
competition = ["numpy>=1.26", "pandas>=2", "catboost>=1.2.10", "prophet>=1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
